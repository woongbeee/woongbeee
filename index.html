<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle DB — Interactive Learning Book</title>
    <!-- 포트폴리오 진입점: 사이트 루트(해시/쿼리 없는 순수 진입)는 이력서(resume.html)로 리다이렉트.
         #book 으로 오면 리다이렉트하지 않고 아래에서 React 학습서(BookLayout)를 그대로 렌더.
         #simulator · ?print= 등 기존 특수 진입점도 리다이렉트 대상에서 제외. -->
    <script>
      (function () {
        if (
          window.location.hash === '' &&
          !window.location.search &&
          !/\/resume\.html$/.test(window.location.pathname)
        ) {
          window.location.replace('resume.html')
        }
      })()
    </script>
    <!-- 테마 FOUC 방지: React 마운트 전에 <html data-theme> 를 먼저 세팅.
         로직은 src/store/simulationStore.ts 의 initialTheme() 와 일치해야 함. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('oracle-book-theme')
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
